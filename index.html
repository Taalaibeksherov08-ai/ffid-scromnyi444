<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0a0e27">
<title>FFID Каталог · Аккаунт IDлер · ₽ Баасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-primary: #060818;
    --bg-secondary: #0d1230;
    --bg-card: #111738;
    --bg-hover: #1a2255;
    --accent: #4f7cff;
    --accent-glow: #6d9bff;
    --accent-gradient: linear-gradient(135deg, #4f7cff 0%, #a855f7 50%, #ec4899 100%);
    --gold: #fbbf24;
    --gold-gradient: linear-gradient(135deg, #fbbf24, #f59e0b);
    --green: #10b981;
    --red: #ef4444;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: rgba(79, 124, 255, 0.15);
    --border-hover: rgba(79, 124, 255, 0.4);
    --shadow-lg: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 40px rgba(79, 124, 255, 0.3);
    --radius: 20px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(79, 124, 255, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168, 85, 247, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating particles */
  .particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.4;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Main container */
  .app {
    position: relative;
    z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.95), rgba(13, 18, 48, 0.95));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-gradient);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 52px;
    height: 52px;
    background: var(--accent-gradient);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    box-shadow: var(--shadow-glow);
    flex-shrink: 0;
    position: relative;
  }

  .brand-icon::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: var(--accent-gradient);
    filter: blur(12px);
    opacity: 0.5;
    z-index: -1;
  }

  .brand-text h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }

  /* Currency badge */
  .currency-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(79, 124, 255, 0.1);
    border: 1px solid rgba(79, 124, 255, 0.3);
    border-radius: 100px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.85rem;
    transition: var(--transition);
  }

  .currency-badge:hover {
    background: rgba(79, 124, 255, 0.2);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .currency-badge i {
    color: var(--gold);
    font-size: 1rem;
  }

  .currency-badge .rate {
    color: var(--accent-glow);
    font-weight: 700;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .stat-card:hover {
    background: rgba(79, 124, 255, 0.08);
    border-color: var(--border-hover);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px -10px rgba(79, 124, 255, 0.3);
  }

  .stat-card .icon {
    font-size: 1.2rem;
    margin-bottom: 8px;
    display: block;
  }

  .stat-card .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .stat-card .value {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card .sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
  }

  /* ===== CONTROLS ===== */
  .controls {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.9), rgba(13, 18, 48, 0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .search-wrapper {
    position: relative;
    width: 100%;
  }

  .search-wrapper i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1rem;
    transition: var(--transition);
    pointer-events: none;
  }

  .search-wrapper:focus-within i {
    color: var(--accent);
  }

  .search-input {
    width: 100%;
    padding: 16px 18px 16px 50px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    outline: none;
    transition: var(--transition);
  }

  .search-input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
  }

  .search-input:focus {
    border-color: var(--accent);
    background: rgba(79, 124, 255, 0.05);
    box-shadow: 0 0 0 4px rgba(79, 124, 255, 0.1), var(--shadow-glow);
  }

  /* Filter tabs */
  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .filter-tabs::-webkit-scrollbar {
    display: none;
  }

  .filter-tab {
    flex-shrink: 0;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-tab:hover {
    background: rgba(79, 124, 255, 0.1);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .filter-tab.active {
    background: var(--accent-gradient);
    border-color: transparent;
    color: white;
    box-shadow: 0 6px 20px -5px rgba(79, 124, 255, 0.5);
  }

  .filter-tab i {
    font-size: 0.8rem;
  }

  .filter-tab .count {
    background: rgba(255, 255, 255, 0.15);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 700;
  }

  /* Sort row */
  .sort-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sort-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }

  .sort-btn {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sort-btn:hover {
    background: rgba(79, 124, 255, 0.1);
    border-color: var(--border-hover);
    color: var(--text-primary);
  }

  .sort-btn.active {
    background: rgba(79, 124, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-glow);
  }

  .sort-btn i {
    font-size: 0.7rem;
  }

  /* ===== TABLE ===== */
  .table-section {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.9), rgba(13, 18, 48, 0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  .table-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2);
    flex-wrap: wrap;
    gap: 10px;
  }

  .table-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .table-title i {
    color: var(--accent);
  }

  .table-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .table-count span {
    color: var(--accent-glow);
    font-weight: 700;
  }

  /* Mobile card view */
  .cards-container {
    display: none;
    padding: 12px;
    gap: 10px;
    flex-direction: column;
  }

  .account-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .account-card:hover {
    background: rgba(79, 124, 255, 0.08);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px -10px rgba(79, 124, 255, 0.3);
  }

  .account-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--accent-gradient);
    opacity: 0;
    transition: var(--transition);
  }

  .account-card:hover::before {
    opacity: 1;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }

  .card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }

  .card-id i {
    color: var(--accent);
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .card-prices {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .price-usd {
    font-size: 0.9rem;
    color: var(--text-secondary);
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }

  .price-rub {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(251, 191, 36, 0.1);
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid rgba(251, 191, 36, 0.25);
  }

  .price-rub i {
    font-size: 0.85rem;
  }

  /* Desktop table view */
  .table-container {
    display: block;
    overflow-x: auto;
    max-height: 70vh;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
  }

  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }

  th {
    padding: 16px 20px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    background: rgba(10, 14, 39, 0.98);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th:first-child { padding-left: 24px; }
  th:last-child { padding-right: 24px; text-align: right; }

  td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 0.9rem;
    transition: var(--transition);
  }

  td:first-child { padding-left: 24px; }
  td:last-child { padding-right: 24px; text-align: right; }

  tbody tr {
    transition: var(--transition);
    animation: rowIn 0.3s ease both;
  }

  @keyframes rowIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  tbody tr:hover {
    background: rgba(79, 124, 255, 0.06);
  }

  tbody tr:hover td {
    border-bottom-color: rgba(79, 124, 255, 0.2);
  }

  .td-id {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .td-id i {
    color: var(--accent);
    font-size: 0.8rem;
  }

  .td-usd {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .td-rub {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--gold);
    font-size: 0.95rem;
  }

  .td-rub .rub-icon {
    font-size: 0.8rem;
    opacity: 0.8;
    margin-right: 2px;
  }

  /* Empty state */
  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty-state.visible {
    display: block;
  }

  .empty-state i {
    font-size: 4rem;
    margin-bottom: 20px;
    display: block;
    color: var(--border-hover);
  }

  .empty-state h3 {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 0.9rem;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .footer .rate-line {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(79, 124, 255, 0.08);
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 100px;
  }

  .footer .rate-line i {
    color: var(--gold);
  }

  .footer .rate-line strong {
    color: var(--accent-glow);
  }

  /* Scrollbar styling */
  .table-container::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .table-container::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2);
  }

  .table-container::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 4px;
  }

  .table-container::-webkit-scrollbar-thumb:hover {
    background: var(--accent-glow);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .cards-container {
      display: flex;
    }
    .table-container {
      display: none;
    }
  }

  @media (max-width: 640px) {
    .app {
      padding: 12px 10px 40px;
    }

    .header {
      padding: 18px;
      border-radius: 16px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      font-size: 20px;
      border-radius: 13px;
    }

    .brand-text h1 {
      font-size: 1.25rem;
    }

    .brand-text p {
      font-size: 0.7rem;
    }

    .currency-badge {
      padding: 8px 14px;
      font-size: 0.75rem;
      width: 100%;
      justify-content: center;
    }

    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
    }

    .stat-card {
      padding: 12px 8px;
    }

    .stat-card .value {
      font-size: 1.2rem;
    }

    .stat-card .label {
      font-size: 0.6rem;
    }

    .stat-card .sub {
      font-size: 0.6rem;
    }

    .controls {
      padding: 12px;
      border-radius: 16px;
      gap: 10px;
    }

    .search-input {
      padding: 14px 14px 14px 44px;
      font-size: 0.9rem;
      border-radius: 10px;
    }

    .search-wrapper i {
      left: 15px;
      font-size: 0.9rem;
    }

    .filter-tab {
      padding: 8px 14px;
      font-size: 0.78rem;
    }

    .sort-btn {
      padding: 7px 12px;
      font-size: 0.75rem;
    }

    .sort-label {
      font-size: 0.65rem;
      width: 100%;
      margin-bottom: 2px;
    }

    .table-header-bar {
      padding: 12px 16px;
    }

    .table-title {
      font-size: 0.82rem;
    }

    .cards-container {
      padding: 10px;
      gap: 8px;
    }

    .account-card {
      padding: 14px;
      border-radius: 10px;
    }

    .card-id {
      font-size: 0.9rem;
    }

    .price-rub {
      font-size: 1rem;
      padding: 3px 10px;
    }

    .price-usd {
      font-size: 0.82rem;
    }

    .footer {
      font-size: 0.72rem;
      padding: 16px 10px;
    }

    .footer .rate-line {
      padding: 6px 14px;
      font-size: 0.72rem;
    }
  }

  @media (max-width: 380px) {
    .brand-text h1 {
      font-size: 1.1rem;
    }
    .stat-card .value {
      font-size: 1rem;
    }
    .card-id {
      font-size: 0.82rem;
    }
    .price-rub {
      font-size: 0.9rem;
    }
  }

  /* Large screens enhancement */
  @media (min-width: 1400px) {
    .app {
      padding: 30px 24px 80px;
    }
    .header {
      padding: 32px;
    }
    .brand-text h1 {
      font-size: 2rem;

  }

  /* Loading animation */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    gap: 8px;
  }

  .loading-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite both;
  }

  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .tier-bronze { --tier-color: #cd7f32; }
  .tier-silver { --tier-color: #94a3b8; }
  .tier-gold { --tier-color: #fbbf24; }
  .tier-diamond { --tier-color: #22d3ee; }
  .tier-legendary { --tier-color: #ec4899; }
</style>
