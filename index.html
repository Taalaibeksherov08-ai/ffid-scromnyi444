<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#060818">
<title>FFID Catalog · Account IDs · ₽ Price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-primary: #060818;
    --bg-secondary: #0d1230;
    --bg-card: #111738;
    --accent: #4f7cff;
    --accent-glow: #6d9bff;
    --accent-gradient: linear-gradient(135deg, #4f7cff 0%, #a855f7 50%, #ec4899 100%);
    --gold: #fbbf24;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: rgba(79, 124, 255, 0.15);
    --border-hover: rgba(79, 124, 255, 0.4);
    --shadow-lg: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 0 40px rgba(79, 124, 255, 0.3);
    --radius: 20px;
    --radius-sm: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== LIVE ANIMATED BACKGROUND ===== */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(79, 124, 255, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
    animation: bgPulse 8s ease-in-out infinite;
  }

  @keyframes bgPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* Aurora effect */
  .aurora {
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(circle at 30% 40%, rgba(79, 124, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
    animation: auroraMove 20s linear infinite;
  }

  @keyframes auroraMove {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Floating particles */
  .particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    box-shadow: 0 0 10px currentColor;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1) rotate(720deg); opacity: 0; }
  }

  /* Shooting stars */
  .shooting-star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
    animation: shoot 3s linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  .shooting-star::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, white, transparent);
    transform: translateX(-100%);
  }

  @keyframes shoot {
    0% { transform: translate(0, 0); opacity: 1; }
    100% { transform: translate(-400px, 400px); opacity: 0; }
  }

  /* Grid overlay */
  .grid-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(79, 124, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 124, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
    animation: gridMove 30s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.95), rgba(13, 18, 48, 0.95));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
    animation: headerIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes headerIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #4f7cff, #a855f7, #ec4899, #fbbf24, #4f7cff);
    background-size: 300% 100%;
    animation: gradientShift 4s linear infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-icon {
    width: 52px; height: 52px;
    background: var(--accent-gradient);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: white;
    box-shadow: var(--shadow-glow);
    flex-shrink: 0;
    position: relative;
    animation: iconPulse 3s ease-in-out infinite;
  }

  @keyframes iconPulse {
    0%, 100% { box-shadow: 0 0 30px rgba(79, 124, 255, 0.4); }
    50% { box-shadow: 0 0 50px rgba(168, 85, 247, 0.6); }
  }

  .brand-icon::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: var(--accent-gradient);
    filter: blur(12px);
    opacity: 0.5;
    z-index: -1;
    animation: iconPulse 3s ease-in-out infinite;
  }

  .brand-text h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .brand-text p {
    font-size: 0.8rem;
    color: var(--text-secondary);
    font-weight: 500;
    margin-top: 2px;
  }

  .currency-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(79, 124, 255, 0.1);
    border: 1px solid rgba(79, 124, 255, 0.3);
    border-radius: 100px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.85rem;
    transition: var(--transition);
    animation: badgeFloat 3s ease-in-out infinite;
  }

  @keyframes badgeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .currency-badge:hover {
    background: rgba(79, 124, 255, 0.2);
    border-color: var(--accent);
    transform: scale(1.05);
  }
  .currency-badge i { color: var(--gold); font-size: 1rem; }
  .currency-badge .rate { color: var(--accent-glow); font-weight: 700; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .stat-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    animation: statIn 0.5s ease backwards;
  }

  .stat-card:nth-child(1) { animation-delay: 0.1s; }
  .stat-card:nth-child(2) { animation-delay: 0.2s; }
  .stat-card:nth-child(3) { animation-delay: 0.3s; }
  .stat-card:nth-child(4) { animation-delay: 0.4s; }

  @keyframes statIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(79, 124, 255, 0.1), transparent);
    transition: left 0.6s;
  }

  .stat-card:hover::before {
    left: 100%;
  }

  .stat-card:hover {
    background: rgba(79, 124, 255, 0.08);
    border-color: var(--border-hover);
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 15px 40px -10px rgba(79, 124, 255, 0.4);
  }
  .stat-card .icon { font-size: 1.2rem; margin-bottom: 8px; display: block; }
  .stat-card .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card .sub {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
  }

  /* ===== CONTROLS ===== */
  .controls {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.9), rgba(13, 18, 48, 0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: headerIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s backwards;
  }

  .search-wrapper { position: relative; width: 100%; }
  .search-wrapper i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 1rem;
    transition: var(--transition);
    pointer-events: none;
  }
  .search-wrapper:focus-within i { color: var(--accent); animation: searchPulse 1s infinite; }

  @keyframes searchPulse {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.2); }
  }

  .search-input {
    width: 100%;
    padding: 16px 18px 16px 50px;
    background: rgba(0, 0, 0, 0.3);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    outline: none;
    transition: var(--transition);
  }
  .search-input::placeholder { color: var(--text-muted); font-weight: 400; }
  .search-input:focus {
    border-color: var(--accent);
    background: rgba(79, 124, 255, 0.05);
    box-shadow: 0 0 0 4px rgba(79, 124, 255, 0.1), var(--shadow-glow);
  }

  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    flex-shrink: 0;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-tab:hover {
    background: rgba(79, 124, 255, 0.1);
    border-color: var(--border-hover);
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .filter-tab.active {
    background: var(--accent-gradient);
    border-color: transparent;
    color: white;
    box-shadow: 0 6px 20px -5px rgba(79, 124, 255, 0.6);
    animation: tabGlow 2s ease-in-out infinite;
  }

  @keyframes tabGlow {
    0%, 100% { box-shadow: 0 6px 20px -5px rgba(79, 124, 255, 0.6); }
    50% { box-shadow: 0 8px 30px -5px rgba(168, 85, 247, 0.8); }
  }

  .filter-tab i { font-size: 0.8rem; }
  .filter-tab .count {
    background: rgba(255, 255, 255, 0.15);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sort-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }
  .sort-btn {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sort-btn:hover {
    background: rgba(79, 124, 255, 0.1);
    border-color: var(--border-hover);
    color: var(--text-primary);
    transform: translateY(-2px);
  }
  .sort-btn.active {
    background: rgba(79, 124, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent-glow);
    box-shadow: 0 4px 15px -3px rgba(79, 124, 255, 0.4);
  }
  .sort-btn i { font-size: 0.7rem; }

  /* ===== TABLE ===== */
  .table-section {
    background: linear-gradient(135deg, rgba(17, 23, 56, 0.9), rgba(13, 18, 48, 0.9));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    animation: headerIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.3s backwards;
  }
  .table-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2);
    flex-wrap: wrap;
    gap: 10px;
  }
  .table-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .table-title i { color: var(--accent); animation: rotate 4s linear infinite; }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .table-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .table-count span { color: var(--accent-glow); font-weight: 700; }

  /* Mobile cards */
  .cards-container {
    display: none;
    padding: 12px;
    gap: 10px;
    flex-direction: column;
    max-height: 75vh;
    overflow-y: auto;
  }

  .account-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s ease both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .account-card:hover {
    background: rgba(79, 124, 255, 0.08);
    border-color: var(--border-hover);
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 15px 40px -10px rgba(79, 124, 255, 0.4);
  }
  .account-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent-gradient);
    opacity: 0;
    transition: var(--transition);
  }
  .account-card:hover::before { opacity: 1; }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }
  .card-id i { color: var(--accent); font-size: 0.85rem; flex-shrink: 0; }
  .card-prices {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .price-usd {
    font-size: 0.9rem;
    color: var(--text-secondary);
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  .price-rub {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(251, 191, 36, 0.1);
    padding: 4px 12px;
    border-radius: 100px;
    border: 1px solid rgba(251, 191, 36, 0.25);
    transition: var(--transition);
  }
  .account-card:hover .price-rub {
    background: rgba(251, 191, 36, 0.2);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
  }
  .price-rub i { font-size: 0.85rem; }

  /* Desktop table */
  .table-container {
    display: block;
    overflow-x: auto;
    max-height: 75vh;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
  }
  thead { position: sticky; top: 0; z-index: 10; }
  th {
    padding: 16px 20px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    background: rgba(10, 14, 39, 0.98);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th:first-child { padding-left: 24px; }
  th:last-child { padding-right: 24px; text-align: right; }
  td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    font-size: 0.9rem;
    transition: var(--transition);
  }
  td:first-child { padding-left: 24px; }
  td:last-child { padding-right: 24px; text-align: right; }
  tbody tr {
    transition: var(--transition);
    animation: rowIn 0.4s ease both;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  tbody tr:hover {
    background: rgba(79, 124, 255, 0.08);
    transform: scale(1.005);
    box-shadow: inset 0 0 30px rgba(79, 124, 255, 0.1);
  }
  tbody tr:hover td { border-bottom-color: rgba(79, 124, 255, 0.3); }

  .td-id {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .td-id i { color: var(--accent); font-size: 0.8rem; transition: var(--transition); }
  tbody tr:hover .td-id i { transform: scale(1.3) rotate(10deg); color: var(--accent-glow); }

  .td-usd {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .td-rub {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--gold);
    font-size: 0.95rem;
  }
  .td-rub .rub-icon { font-size: 0.8rem; opacity: 0.8; margin-right: 2px; }

  /* Empty state */
  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state.visible { display: block; }
  .empty-state i {
    font-size: 4rem;
    margin-bottom: 20px;
    display: block;
    color: var(--border-hover);
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  .empty-state h3 {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .empty-state p { font-size: 0.9rem; }

    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;

  .footer .rate-line {

    align-items: center;
    gap: 8px;
    background: rgba(79, 124, 255, 0.08);
    border: 1px solid var(--border);

    border-radius: 100px;

  .cards-container::-webkit-scrollbar { width: 8px; height: 8px; }

  .table-container::-webkit-scrollbar-thumb,
  .cards-container::-webkit-scrollbar-thumb {

  .table-container::-webkit-scrollbar-thumb:hover,

    .currency-badge { padding: 8px 14px; font-size: 0.75rem; }

      margin-top: 16px;
      padding-top: 16px;

    .stat-card .value { font-size: 1.2rem; }
    .stat-card .label { font-size: 0.6rem; }
    .stat-card .sub { font-size: 0.6rem; }

    .controls { padding: 12px; border-radius: 16px; gap: 10px; }
    .search-input { padding: 14px 14px 14px 44px; font-size: 0.9rem; border-radius: 10px; }

    .table-header-bar { padding: 12px 16px; }
    .table-title { font-size: 0.82rem; }
    .cards-container { padding: 10px; gap: 8px; max-height: 70vh; }

    .card-id { font-size: 0.9rem; }
    .price-rub { font-size: 1rem; padding: 3px 10px; }
    .price-usd { font-size: 0.82rem; }

<div class="aurora"></div>
<div class="grid-overlay"></div>
<div class="particles" id="particles"></div>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">
          <i class="fas fa-id-card"></i>
        </div>
        <div class="brand-text">
          <h1>FFID Catalog</h1>
          <p>Account IDs · Price list</p>
        </div>
      </div>
      <div class="currency-badge">
        <i class="fas fa-ruble-sign"></i>
        <span>$1 = <span class="rate">92.50 ₽</span></span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="icon">📊</span>
        <div class="label">Total</div>
        <div class="value" id="statTotal">0</div>
        <div class="sub">accounts</div>
      </div>
      <div class="stat-card">
        <span class="icon">💰</span>
        <div class="label">Min price</div>
        <div class="value" id="statMin">—</div>
        <div class="sub" id="statMinRub">—</div>
      </div>
      <div class="stat-card">
        <span class="icon">💎</span>
        <div class="label">Max price</div>
        <div class="value" id="statMax">—</div>
        <div class="sub" id="statMaxRub">—</div>
      </div>
      <div class="stat-card">
        <span class="icon">📈</span>
        <div class="label">Average</div>
        <div class="value" id="statAvg">—</div>
        <div class="sub" id="statAvgRub">—</div>
      </div>
    </div>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Search account ID... Example: 17333331130" autocomplete="off" inputmode="numeric">
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">
        <i class="fas fa-layer-group"></i> All
        <span class="count" id="countAll">0</span>
      </button>
      <button class="filter-tab" data-filter="budget">
        <i class="fas fa-coins"></i> Budget
        <span class="count" id="countBudget">0</span>
      </button>
      <button class="filter-tab" data-filter="mid">
        <i class="fas fa-gem"></i> Mid-range
        <span class="count" id="countMid">0</span>
      </button>
      <button class="filter-tab" data-filter="premium">
        <i class="fas fa-crown"></i> Premium
        <span class="count" id="countPremium">0</span>
      </button>
    </div>

    <div class="sort-row">
      <span class="sort-label"><i class="fas fa-arrow-down-up-across-line"></i> Sort:</span>
      <button class="sort-btn active" data-sort="desc">
        <i class="fas fa-arrow-down-wide-short"></i> High → Low
      </button>
      <button class="sort-btn" data-sort="asc">
        <i class="fas fa-arrow-up-wide-short"></i> Low → High
      </button>
      <button class="sort-btn" data-sort="id">
        <i class="fas fa-hashtag"></i> By ID
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-section">
    <div class="table-header-bar">
      <div class="table-title">
        <i class="fas fa-database"></i>
        <span>Accounts</span>
      </div>
      <div class="table-count">
        Shown: <span id="shownCount">0</span> / <span id="totalCount">0</span>
      </div>
    </div>

    <!-- Mobile cards -->
    <div class="cards-container" id="cardsContainer"></div>

    <!-- Desktop table -->
    <div class="table-container" id="tableContainer">
      <table>
        <thead>
          <tr>
            <th>Account ID</th>
            <th>Price (USD)</th>
            <th>Price (₽ RUB)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState">
      <i class="fas fa-search"></i>
      <h3>No accounts found</h3>
      <p>Try a different search or filter.</p>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="rate-line">
      <i class="fas fa-calculator"></i>
      <span>Fixed rate: 1 USD = <strong>92.50 ₽</strong></span>
    </div>
    <div>
      <i class="fas fa-code"></i> FFID Catalog · <span id="year"></span>
    </div>
  </div>
</div>

/* ===================== CONFIG ===================== */
const USD_TO_RUB = 92.50;

/* ===================== STATE ===================== */
let currentSort = 'desc';
let currentFilter = 'all';
let searchTerm = '';

/* ===================== DOM ===================== */
const tableBody = document.getElementById('tableBody');
const cardsContainer = document.getElementById('cardsContainer');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
const shownCount = document.getElementById('shownCount');
const totalCount = document.getElementById('totalCount');
const statTotal = document.getElementById('statTotal');
const statMin = document.getElementById('statMin');
const statMax = document.getElementById('statMax');
const statAvg = document.getElementById('statAvg');
const statMinRub = document.getElementById('statMinRub');
const statMaxRub = document.getElementById('statMaxRub');
const statAvgRub = document.getElementById('statAvgRub');
const countAll = document.getElementById('countAll');
const countBudget = document.getElementById('countBudget');
const countMid = document.getElementById('countMid');
const countPremium = document.getElementById('countPremium');

/* ===================== HELPERS ===================== */
function formatRub(usd) {
  const rub = usd * USD_TO_RUB;
  return rub.toLocaleString('en-US', { 
    minimumFractionDigits: 2, maximumFractionDigits: 2 
  });
}
function formatUsd(usd) {
  return usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatNumber(n) {
  return n.toLocaleString('en-US');
}

/* ===================== STATS ===================== */
function updateStats() {
  const prices = rawAccounts.map(a => a.price);
  const total = rawAccounts.length;
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const avg = prices.reduce((s, p) => s + p, 0) / total;

  statTotal.textContent = formatNumber(total);
  statMin.textContent = '$' + formatUsd(min);
  statMax.textContent = '$' + formatUsd(max);
  statAvg.textContent = '$' + formatUsd(avg);
  statMinRub.textContent = formatRub(min) + ' ₽';
  statMaxRub.textContent = formatRub(max) + ' ₽';
  statAvgRub.textContent = formatRub(avg) + ' ₽';

  const budget = rawAccounts.filter(a => a.price < 10).length;
  const mid = rawAccounts.filter(a => a.price >= 10 && a.price < 50).length;
  const premium = rawAccounts.filter(a => a.price >= 50).length;
  countAll.textContent = total;
  countBudget.textContent = budget;
  countMid.textContent = mid;
  countPremium.textContent = premium;
  totalCount.textContent = formatNumber(total);
}

/* ===================== RENDER ===================== */
function getFiltered() {
  let list = rawAccounts.slice();
  if (currentFilter === 'budget') list = list.filter(a => a.price < 10);
  else if (currentFilter === 'mid') list = list.filter(a => a.price >= 10 && a.price < 50);
  else if (currentFilter === 'premium') list = list.filter(a => a.price >= 50);

  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    list = list.filter(a => a.account_id.toLowerCase().includes(q));
  }

  if (currentSort === 'asc') list.sort((a, b) => a.price - b.price);
  else if (currentSort === 'desc') list.sort((a, b) => b.price - a.price);
  else if (currentSort === 'id') list.sort((a, b) => a.account_id.localeCompare(b.account_id));

  return list;
}

function render() {
  const list = getFiltered();

  if (list.length === 0) {
    tableBody.innerHTML = '';
    cardsContainer.innerHTML = '';
    emptyState.classList.add('visible');
    shownCount.textContent = '0';
    return;
  }
  emptyState.classList.remove('visible');
  shownCount.textContent = formatNumber(list.length);

  // Desktop rows
  tableBody.innerHTML = list.map((a, i) => `
    <tr style="animation-delay: ${Math.min(i * 5, 500)}ms">
      <td><div class="td-id"><i class="fas fa-id-card"></i>${a.account_id}</div></td>
      <td class="td-usd">$${formatUsd(a.price)}</td>
      <td class="td-rub"><span class="rub-icon">₽</span>${formatRub(a.price)}</td>
    </tr>
  `).join('');

  // Mobile cards
  cardsContainer.innerHTML = list.map((a, i) => `
    <div class="account-card" style="animation-delay: ${Math.min(i * 10, 800)}ms">
      <div class="card-top">
        <div class="card-id"><i class="fas fa-id-card"></i>${a.account_id}</div>
      </div>
      <div class="card-prices">
        <div class="price-usd">$${formatUsd(a.price)}</div>
        <div class="price-rub"><i class="fas fa-ruble-sign"></i>${formatRub(a.price)}</div>
      </div>
    </div>
  `).join('');
}

/* ===================== PARTICLES ===================== */
function createParticles() {
  const container = document.getElementById('particles');
  const count = window.innerWidth < 640 ? 25 : 50;
  const colors = ['#4f7cff', '#a855f7', '#ec4899', '#fbbf24', '#22d3ee'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 1;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 15 + 12) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.opacity = Math.random() * 0.6 + 0.2;
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = color;
    p.style.color = color;
    container.appendChild(p);
  }
}

/* Shooting stars */
function createShootingStars() {
  setInterval(() => {
    if (document.querySelectorAll('.shooting-star').length > 3) return;
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.top = Math.random() * 50 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDuration = (Math.random() * 2 + 2) + 's';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 4000);
  }, 3000);
}

/* ===================== EVENTS ===================== */
function init() {
  createParticles();
  createShootingStars();
  document.getElementById('year').textContent = new Date().getFullYear();

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    render();
  });

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSort = btn.dataset.sort;
      render();
    });
  });

  updateStats();
  render();
}

window.addEventListener('DOMContentLoaded', init);

/* Pause animations when tab is hidden (performance) */
document.addEventListener('visibilitychange', () => {
  document.body.style.animationPlayState = document.hidden ? 'paused' : 'running';
});
</script>
</body>
</html>
